<div class="clock" role="timer" aria-label="Heure locale de votre appareil">
  <span class="clock-dot" aria-hidden="true"></span>
  <span class="clock-label">SYSTÈME EN LIGNE</span>
  <span id="local-time">--:--:--</span>
</div>
<style>
  html,body{margin:0;background:transparent;font:12px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  .clock{display:flex;width:max-content;align-items:center;gap:10px;color:#9fe8ff;
    padding:6px 13px;border:1px solid rgba(34,211,238,.35);border-radius:999px;
    background:rgba(8,20,40,.85);box-shadow:0 0 18px rgba(34,211,238,.15) inset}
  .clock-label{letter-spacing:.14em;color:#5eead4;font-size:10.5px}
  #local-time{color:#e6f7ff;font-weight:700;letter-spacing:.06em}
  .clock-dot{width:8px;height:8px;border-radius:50%;background:#2ee6a6;
    box-shadow:0 0 0 4px rgba(46,230,166,.18);animation:clock-pulse 1.6s ease-in-out infinite}
  @keyframes clock-pulse{50%{box-shadow:0 0 0 8px rgba(46,230,166,0)}}
  @media(prefers-reduced-motion:reduce){.clock-dot{animation:none}}
</style>
<!-- CIVITAS_CLOCK_SCRIPT -->
